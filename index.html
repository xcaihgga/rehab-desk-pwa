<script>
/* 加载兜底：任一脚本没加载上、或初始化没跑起来，给用户一句能看懂的话，而不是一片空白。
   只做提示，不碰任何病历数据。 */
window.__bootFail = function (why) {
  if (window.__appReady) return;
  var paint = function () {
    var d = document.getElementById('bootGuard');
    if (d && d.getAttribute('data-locked') === '1') return;   /* 先把准确原因钉住，后续兜底提示不覆盖 */
    if (!d) {
      d = document.createElement('div');
      d.id = 'bootGuard';
      d.setAttribute('style', 'position:fixed;left:0;right:0;top:0;z-index:9999;padding:12px 16px;background:#fdf1ef;border-bottom:1px solid #e6b8b2;color:#8a2f26;font:14px/1.7 -apple-system,"PingFang SC","Microsoft YaHei",sans-serif;box-shadow:0 4px 14px rgba(120,40,30,.12)');
      (document.body || document.documentElement).appendChild(d);
    }
    d.setAttribute('data-locked', '1');
    d.innerHTML = '<b>页面没加载完整</b>：' + why + '。<br>请联网后刷新（下拉刷新或 Ctrl+R）。如果反复这样，先别录新病人，以免只保存一半。';
  };
  if (document.body) paint(); else document.addEventListener('DOMContentLoaded', paint);
};
window.addEventListener('error', function (e) {
  if (window.__appReady) return;
  if (e && e.target && e.target.tagName === 'SCRIPT') return;   /* 脚本 404 由各自的 onerror 报，避免重复 */
  window.__bootFail('页面脚本出错（' + ((e && e.message) || '未知错误').slice(0, 80) + '）');
}, true);
/* 兜底检查放在 head：即使后面某个大脚本把页面解析卡住，这个定时器也已经注册 */
setTimeout(function () { if (!window.__appReady) window.__bootFail('核心脚本超过 9 秒仍未就绪'); }, 9000);
</script>

<body>
<header class="appbar">
  <div class="brand">
    <div class="seal" aria-hidden="true"><span>康</span></div>
    <div class="brand-text">
      <div class="brand-name">康复病历工作台</div>
      <div class="brand-sub">REHABILITATION · RECORD DESK</div>
    </div>
  </div>

  <div class="appbar-center">
    <label class="switch">
      <span class="switch-label">当前患者</span>
      <select id="patientSwitch" aria-label="切换当前患者"></select>
    </label>
  </div>

  <div class="appbar-actions">
    <span class="save-state" id="saveState"><span class="dot"></span><span>已自动保存</span></span>
    <button class="btn ghost assistant-launch" data-action="toggle-assistant" title="打开病历助手">
      <svg viewBox="0 0 24 24" class="ic"><path d="M12 3v3m0 12v3M3 12h3m12 0h3M5.6 5.6l2.1 2.1m8.6 8.6 2.1 2.1m0-12.8-2.1 2.1m-8.6 8.6-2.1 2.1"/><circle cx="12" cy="12" r="3.2"/></svg>
      助手
    </button>
    <button class="btn ghost" data-action="app-settings" title="设置：显示、字号、医师资料与数据">
      <svg viewBox="0 0 24 24" class="ic"><path d="M4 7h16M4 12h16M4 17h16"/><circle cx="9" cy="7" r="2"/><circle cx="15" cy="12" r="2"/><circle cx="7" cy="17" r="2"/></svg>
      设置
    </button>
    <button class="btn ghost" data-action="data-manage" title="数据备份与恢复">
      <svg viewBox="0 0 24 24" class="ic"><ellipse cx="12" cy="5" rx="8" ry="3"/><path d="M4 5v14c0 1.7 3.6 3 8 3s8-1.3 8-3V5"/><path d="M4 12c0 1.7 3.6 3 8 3s8-1.3 8-3"/></svg>
      备份
    </button>
    <button class="btn ghost" data-action="print" title="打印当前病历">
      <svg viewBox="0 0 24 24" class="ic"><path d="M7 9V4h10v5M7 19H5a2 2 0 0 1-2-2v-4a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2v4a2 2 0 0 1-2 2h-2"/><rect x="7" y="14" width="10" height="7" rx="1"/></svg>
      打印
    </button>
    <button class="btn ghost" data-action="export-word" title="导出：Word / 网页 / 纯文本 / 全量备份">
      <svg viewBox="0 0 24 24" class="ic"><path d="M12 3v12m0 0 4-4m-4 4-4-4"/><path d="M4 17v2a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2v-2"/></svg>
      导出
    </button>
    <button class="btn solid" data-action="auto-fill-all" title="根据病种模板、评估数据、鉴别诊断、出院医嘱一键补全当前患者所有空字段">
      <svg viewBox="0 0 24 24" class="ic" style="stroke:#fff"><path d="M13 2 3 14h7l-1 8 10-12h-7l1-8Z"/></svg>
      ⚡ 一键完成
    </button>
    <button class="btn primary" data-action="new-patient">
      <svg viewBox="0 0 24 24" class="ic"><path d="M12 5v14M5 12h14"/></svg>
      新建患者
    </button>
  </div>
</header>

<main class="shell">
  <aside class="rail" id="rail">
    <div class="rail-head">
      <div class="rail-title-row">
        <h2>患者列表</h2>
        <span class="count" id="patientCount">0</span>
      </div>
      <div class="searchbox">
        <svg viewBox="0 0 24 24" class="ic"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg>
        <input id="patientSearch" type="search" placeholder="搜索姓名 / 床号 / 住院号" autocomplete="off">
      </div>
      <div class="filters" id="statusFilters">
        <button class="chip active" data-filter="all">全部</button>
        <button class="chip" data-filter="住院">住院</button>
        <button class="chip" data-filter="门诊">门诊</button>
        <button class="chip" data-filter="已出院">已出院</button>
      </div>
    </div>
    <div class="demo-banner" id="demoBanner" hidden></div>
    <div class="patient-list" id="patientList"></div>
    <div class="rail-foot">
      <div class="rail-tip">
        <svg viewBox="0 0 24 24" class="ic"><path d="M12 8v5m0 3v.5"/><circle cx="12" cy="12" r="9"/></svg>
        评估数据自动带入病程与目标
      </div>
    </div>
  </aside>

  <section class="workspace">
    <div class="doc-head" id="docHead"></div>
    <nav class="tabs" id="tabs" aria-label="病历分区">
      <div class="tab-group" id="tabGroup">
        <button class="tab" data-tab="admit">入院记录</button>
        <button class="tab" data-tab="assess">康复评估<i class="tab-dot" id="assessDot"></i></button>
        <button class="tab" data-tab="course">病程记录<i class="tab-dot" id="courseDot"></i></button>
        <button class="tab" data-tab="discharge">出院记录</button>
        <button class="tab" data-tab="report">报告解读</button>
      </div>
      <div class="tabs-tools">
        <div class="view-mode" id="viewMode">
          <button class="vm-btn" data-vmode="edit">编辑</button>
          <button class="vm-btn active" data-vmode="split">并排预览</button>
          <button class="vm-btn" data-vmode="preview">预览</button>
        </div>
        <div class="qc-inline" id="qcInline"></div>
      </div>
    </nav>
    <div class="view-wrap">
      <div class="view" id="view"></div>
      <div class="preview-pane" id="previewPane"></div>
    </div>
  </section>

  <aside class="assistant" id="assistant">
    <div class="assistant-head">
      <div class="assistant-title">
        <svg viewBox="0 0 24 24" class="ic"><path d="M12 3v3m0 12v3M3 12h3m12 0h3M5.6 5.6l2.1 2.1m8.6 8.6 2.1 2.1m0-12.8-2.1 2.1m-8.6 8.6-2.1 2.1"/><circle cx="12" cy="12" r="3.2"/></svg>
        病历助手
      </div>
      <button class="icon-btn" data-action="toggle-assistant" title="收起/展开助手">
        <svg viewBox="0 0 24 24" class="ic"><path d="m9 6 6 6-6 6"/></svg>
      </button>
    </div>
    <div class="segmented" id="assistantTabs">
      <button class="seg active" data-atab="notes">语句库</button>
      <button class="seg" data-atab="diagnosis">⚡ 诊断参考</button>
      <button class="seg" data-atab="compose">智能生成</button>
      <button class="seg" data-atab="qc">质控</button>
    </div>
    <div class="assistant-body" id="assistantBody"></div>
    <div class="assistant-foot">
      <button class="link-btn" data-action="open-sources">量表评分依据与出处</button>
      <span class="ver">v1.44 · 本地存储</span>
    </div>
  </aside>
</main>

<div class="scrim" id="scrim" data-action="close-modal"></div>
<div class="modal-wrap" id="modalWrap" aria-hidden="true">
  <div class="modal" role="dialog" aria-modal="true" id="modal"></div>
</div>

<div class="toast" id="toast" role="status" aria-live="polite"></div>
<div class="print-root" id="printRoot"></div>

<script src="data.js" defer onerror="window.__bootFail('基础数据文件 data.js 没加载上')"></script>
<script src="templates-bingli.js" defer onerror="window.__bootFail('病种模板库没加载上（templates-bingli.js）')"></script>
<script src="schemas-bingli.js" defer onerror="window.__bootFail('病历字段表没加载上（schemas-bingli.js）')"></script>
<script src="hints-bingli.js" defer onerror="window.__bootFail('书写提示库没加载上（hints-bingli.js）')"></script>
<script src="app.js" defer onerror="window.__bootFail('程序主体 app.js 没加载上')"></script>
<!-- ===== PWA 安装引导（不改动应用数据）===== -->
<div id="pwaInstallTip" style="display:none;position:fixed;left:0;right:0;bottom:0;z-index:9990;padding:11px 16px;background:#fffdf7;border-top:1px solid #cfd8d1;box-shadow:0 -6px 22px rgba(20,60,50,.13);font:13px/1.7 -apple-system,"PingFang SC","Microsoft YaHei",sans-serif;color:#24413a;align-items:center;gap:12px;">
  <div id="pwaInstallText" style="flex:1;min-width:0;"><b style="color:#0e6b58;">装到手机桌面</b>，以后像 App 一样打开：没有地址栏、断网也能用，数据仍只存在这台设备。</div>
  <button id="pwaInstallGo" style="flex:none;border:0;border-radius:999px;padding:8px 16px;background:#0e6b58;color:#fff;font-size:13px;font-weight:600;cursor:pointer;">装到桌面</button>
  <button id="pwaInstallNo" style="flex:none;border:0;background:transparent;color:#6b7f78;font-size:13px;cursor:pointer;padding:8px 4px;">以后再说</button>
</div>
<script>
(function () {
  var TIP_KEY = 'rehab.pwa.tip';
  var deferred = null;
  var tip = document.getElementById('pwaInstallTip');
  var txt = document.getElementById('pwaInstallText');
  var go = document.getElementById('pwaInstallGo');
  var no = document.getElementById('pwaInstallNo');
  var ua = navigator.userAgent || '';
  var isIOS = /iphone|ipad|ipod/i.test(ua) || (navigator.platform === 'MacIntel' && navigator.maxTouchPoints > 1);
  var isWX = /micromessenger/i.test(ua);
  var standalone = false;
  try { standalone = window.matchMedia('(display-mode: standalone)').matches || navigator.standalone === true; } catch (e) {}
  function hide() { if (tip) tip.style.display = 'none'; }
  function remember() { try { localStorage.setItem(TIP_KEY, '1'); } catch (e) {} }
  function show() {
    if (!tip) return;
    if (standalone) return;
    try { if (localStorage.getItem(TIP_KEY) === '1') return; } catch (e) {}
    if (isWX) { txt.innerHTML = '<b style="color:#0e6b58;">微信里装不了</b>：点右上角「···」→「在浏览器打开」，再从浏览器菜单添加到主屏幕。'; go.style.display = 'none'; }
    else if (isIOS) { txt.innerHTML = '<b style="color:#0e6b58;">加到主屏幕</b>：Safari 底部点「分享」→ 下滑找「添加到主屏幕」→ 右上角「添加」。'; go.style.display = 'none'; }
    tip.style.display = 'flex';
  }
  window.addEventListener('beforeinstallprompt', function (e) { e.preventDefault(); deferred = e; setTimeout(show, 1500); });
  window.addEventListener('appinstalled', function () { hide(); remember(); });
  if (go) go.addEventListener('click', function () { if (deferred) { deferred.prompt(); deferred = null; } hide(); remember(); });
  if (no) no.addEventListener('click', function () { hide(); remember(); });
  setTimeout(show, 6000);
  if ('serviceWorker' in navigator && (location.protocol === 'https:' || location.hostname === 'localhost' || location.hostname === '127.0.0.1')) {
    window.addEventListener('load', function () { navigator.serviceWorker.register('sw.js').catch(function () {}); });
  }
})();
</script>
</body>
</html>
