name: Deploy PWA to Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Download site package
        run: |
          curl -fSL -o site.zip "https://aka.doubaocdn.com/s/C0VfrBPWmt"
          mkdir -p _site
          unzip -q site.zip -d _tmp
          cp -r _tmp/gh/. _site/
          touch _site/.nojekyll
          ls -la _site
      - name: Configure Pages
        uses: actions/configure-pages@v5
        with:
          enablement: true
      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
