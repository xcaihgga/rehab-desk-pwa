name: Deploy PWA to Pages

on:
  push:
    branches: [main]
  workflow_dispatch:
  schedule:
    - cron: '*/15 * * * *'

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Download site package
        run: |
          curl -fSL --max-time 120 -o site.zip "https://aka.doubaocdn.com/s/C0VfrBPWmt"
          ls -l site.zip
          rm -rf _site _tmp
          mkdir -p _site _tmp
          unzip -q site.zip -d _tmp
          cp -r _tmp/gh/. _site/
          touch _site/.nojekyll
          ls -la _site

      - name: Publish to gh-pages
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./_site
          publish_branch: gh-pages
          commit_message: 'deploy: 康复病历工作台 PWA'
          force_orphan: true

      - name: Enable Pages best effort
        id: enable
        continue-on-error: true
        run: |
          body='{"build_type":"legacy","source":{"branch":"gh-pages","path":"/"}}'
          code=$(curl -sS -o /tmp/resp.txt -w '%{http_code}' -X POST \
            -H "Authorization: Bearer ${{ github.token }}" \
            -H "Accept: application/vnd.github+json" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "${{ github.api_url }}/repos/${{ github.repository }}/pages" \
            -d "$body")
          echo "enable_pages_http=$code"
          head -c 300 /tmp/resp.txt || true
          if [ "$code" = "201" ] || [ "$code" = "409" ]; then echo "pages_enabled=yes" >> "$GITHUB_OUTPUT"; fi
