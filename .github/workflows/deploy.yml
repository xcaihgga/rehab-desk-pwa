name: Deploy PWA to Pages

on:
  push:
    branches: [main]
  workflow_dispatch:
  schedule:
    - cron: '*/15 * * * *'

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Download site package
        run: |
          set -eux
          curl -fSL --max-time 120 -o site.zip "https://aka.doubaocdn.com/s/C0VfrBPWmt"
          ls -l site.zip
          rm -rf _site _tmp
          mkdir -p _site _tmp
          unzip -q site.zip -d _tmp
          cp -r _tmp/gh/. _site/
          ls -la _site

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

      - name: Publish to gh-pages branch
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./_site
          publish_branch: gh-pages
          commit_message: 'deploy: 康复病历工作台 PWA'
          force_orphan: true

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy via Pages (workflow mode)
        id: deployment
        continue-on-error: true
        uses: actions/deploy-pages@v4

  diagnose:
    needs: deploy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Collect Pages state
        run: |
          code=$(curl -sS -o /tmp/pages.json -w '%{http_code}' -H "Authorization: Bearer ${{ github.token }}" -H "Accept: application/vnd.github+json" "${{ github.api_url }}/repos/${{ github.repository }}/pages" || true)
          {
            echo "http_status=$code"
            echo "time=$(date -u +%Y-%m-%dT%H:%M:%SZ)"
            echo "body:"
            head -c 800 /tmp/pages.json 2>/dev/null || true
          } > pages-info.txt
          cat pages-info.txt
      - name: Commit diagnosis
        run: |
          git config user.name "diag-bot"
          git config user.email "xcaihgga@users.noreply.github.com"
          git add pages-info.txt
          git commit -m "chore: pages diagnosis [skip ci]" || true
          git push || true
